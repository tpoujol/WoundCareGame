<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Learning Centre | WoundCare Quest</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="brand"><span class="logo-mark">＋</span> Learning Centre</div>
    <nav><a href="index.html">Home</a><a href="snake.html">Snake Challenge</a></nav>
  </header>
  <main>
    <section class="panel">
      <span class="badge">Learn about wound healing</span>
      <h1>Learning Centre</h1>
      <p class="lead">Build your wound care confidence with quick lessons that help you make smart healing choices in every challenge.</p>
    </section>
    <section id="articles" class="lesson-grid" aria-live="polite"></section>
  </main>
  <script id="lesson-manifest" type="application/json">
    [
      {% assign markdown_lessons = site.static_files | where_exp: "file", "file.path contains '/content/'" | where: "extname", ".md" | sort: "path" %}
      {% for lesson in markdown_lessons %}
        "{{ lesson.path | relative_url }}"{% unless forloop.last %},{% endunless %}
      {% endfor %}
    ]
  </script>
  <script>
    const contentFolder = 'content/';

    function readLessonManifest() {
      try {
        const manifest = JSON.parse(document.getElementById('lesson-manifest').textContent);
        return manifest.filter((lesson) => lesson.toLowerCase().endsWith('.md'));
      } catch {
        return [];
      }
    }

    function resolveUrl(path) {
      return new URL(path, window.location.href).href;
    }

    function isMarkdownArticle(href) {
      try {
        const url = new URL(href, resolveUrl(contentFolder));
        return url.origin === window.location.origin
          && url.pathname.startsWith(new URL(contentFolder, window.location.href).pathname)
          && url.pathname.toLowerCase().endsWith('.md');
      } catch {
        return false;
      }
    }

    async function findMarkdownArticles() {
      const manifestLessons = readLessonManifest();
      if (manifestLessons.length) return manifestLessons;

      const response = await fetch(contentFolder);
      if (!response.ok) throw new Error(`Could not inspect ${contentFolder}`);

      const directoryHtml = await response.text();
      const directoryDocument = new DOMParser().parseFromString(directoryHtml, 'text/html');
      return [...directoryDocument.querySelectorAll('a[href]')]
        .map((link) => new URL(link.getAttribute('href'), response.url).href)
        .filter(isMarkdownArticle)
        .sort((a, b) => a.localeCompare(b));
    }

    function escapeHtml(text) {
      return text.replace(/[&<>"]/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[char]));
    }

    function inlineMarkdown(text) {
      return escapeHtml(text)
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g, '<em>$1</em>');
    }

    function markdownToHtml(markdown) {
      const lines = markdown.split('\n');
      let html = '';
      let inList = false;
      lines.forEach((line) => {
        if (line.startsWith('- ')) {
          if (!inList) { html += '<ul>'; inList = true; }
          html += `<li>${inlineMarkdown(line.slice(2))}</li>`;
          return;
        }
        if (inList) { html += '</ul>'; inList = false; }
        if (line.startsWith('# ')) html += `<h2>${inlineMarkdown(line.slice(2))}</h2>`;
        else if (line.startsWith('## ')) html += `<h3>${inlineMarkdown(line.slice(3))}</h3>`;
        else if (line.startsWith('> ')) html += `<blockquote>${inlineMarkdown(line.slice(2))}</blockquote>`;
        else if (line.trim()) html += `<p>${inlineMarkdown(line)}</p>`;
      });
      if (inList) html += '</ul>';
      return html;
    }

    async function loadLessons() {
      const container = document.getElementById('articles');
      try {
        const lessons = await findMarkdownArticles();
        if (!lessons.length) throw new Error(`No markdown articles found in ${contentFolder}`);

        const articles = await Promise.all(lessons.map(async (lesson) => {
          const response = await fetch(lesson);
          if (!response.ok) throw new Error(`Could not load ${lesson}`);
          return markdownToHtml(await response.text());
        }));
        container.innerHTML = articles.map((article) => `<article class="article">${article}</article>`).join('');
      } catch (error) {
        container.innerHTML = `<article class="article"><h2>Lesson unavailable</h2><p>${escapeHtml(error.message)}</p><p>Run this app through a local web server so markdown files can be fetched.</p></article>`;
      }
    }

    loadLessons();
  </script>
</body>
</html>
